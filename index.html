<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chov Heterodonů | Nabídka odchovů</title>
  <!-- Načtení moderního grafického frameworku Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">

  <!-- Hlavička -->
  <header class="border-b border-zinc-800 bg-zinc-900/50 py-10 px-6 text-center">
    <h1 class="text-4xl font-extrabold tracking-tight text-amber-500">Hognose Morphs</h1>
    <p class="text-zinc-400 mt-2 max-w-xl mx-auto">Vlastní odchovy Heterodon nasicus. Zdravá, rozkrmená zvířata s kompletní genetickou historií.</p>
  </header>

  <!-- Hlavní obsah -->
  <main class="max-w-6xl mx-auto px-6 py-10">
    
    <!-- Ovládací tlačítka filtru -->
    <div class="flex flex-wrap gap-2 mb-8">
      <button onclick="filtruj('Vše')" class="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 font-medium transition">Všechna zvířata</button>
      <button onclick="filtruj('Volný')" class="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 font-medium transition">Jen volní</button>
      <button onclick="filtruj('1.0')" class="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 font-medium transition">Samci (1.0)</button>
      <button onclick="filtruj('0.1')" class="px-4 py-2 rounded-lg bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 font-medium transition">Samice (0.1)</button>
    </div>

    <!-- Mřížka, do které JavaScript vykreslí karty hadů -->
    <div id="katalog-mrizka" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

  </main>

  <!-- Připojení tvého programu v JavaScriptu -->
  <script src="app.js"></script>
</body>
</html>
